name: Publish

# 打 tag 触发发布：git tag v0.1.1 && git push origin v0.1.1
# 需要仓库 Secret：NPM_TOKEN（npmjs.com 的 Automation Token，可绕过 OTP）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance 需要

jobs:
  publish:
    name: 发布到 npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: 校验 tag 与 package.json 版本一致
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json = $PKG_VERSION / tag = $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag 与 package.json 版本不一致，先改版本号再打 tag"
            exit 1
          fi

      - name: 发布前检查
        run: |
          node tests/render-check.mjs
          node tests/manifest-check.mjs

      - name: npm publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
